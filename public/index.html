<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowCanvas - Visual Workflow Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><rect width='24' height='24' rx='6'/><path d='M7 12h10M12 7l5 5-5 5' stroke='white' stroke-width='2' fill='none'/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Toolbar -->
    <header class="top-toolbar">
      <div class="brand-section">
        <div class="brand-logo" title="FlowCanvas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
          </svg>
        </div>
        <span class="brand-name">FlowCanvas</span>
        <span class="brand-badge">SE Demo</span>
      </div>

      <div class="workflow-status-bar">
        <span class="workflow-name-pill" id="workflow-title-display">Required Demo: Multiply & Condition</span>
        
        <div class="preset-selector-wrap">
          <label for="select-sample-preset" style="font-size: 11px; color: var(--text-muted);">Presets:</label>
          <select id="select-sample-preset" class="preset-select" title="Choose a workflow sample">
            <option value="CANONICAL_DEMO">Required Demo: Start → Input (10) → Multiply 2 → > 15 → Output</option>
            <option value="FALSE_BRANCH_DEMO">Condition Test: Input (5) → Multiply 2 = 10 → False Branch</option>
            <option value="TEXT_DEMO">Text Pipeline: Input Text → Uppercase Transform → Output</option>
          </select>
        </div>
      </div>

      <div class="toolbar-actions">
        <button id="btn-export-json" class="btn btn-secondary" title="Export workflow JSON">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <button id="btn-import-json" class="btn btn-secondary" title="Import workflow JSON">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import
        </button>
        <input type="file" id="file-input-json" accept=".json" style="display:none;" />

        <button id="btn-reset-demo" class="btn btn-secondary" title="Restore canonical sample demo">
          ↺ Reset Demo
        </button>
        <button id="btn-clear-canvas" class="btn btn-secondary" title="Clear canvas">
          🗑 Clear
        </button>
        <button id="btn-run-workflow" class="btn btn-primary" title="Execute this workflow">
          ▶ Run Workflow
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <!-- Left Sidebar: Node Library -->
      <aside class="sidebar-left" id="sidebar-node-library"></aside>

      <!-- Center: Workflow Canvas -->
      <section class="canvas-area">
        <div class="canvas-container" id="canvas-container"></div>
      </section>

      <!-- Right Sidebar: Properties & Execution Trace -->
      <aside class="sidebar-right">
        <div class="panel-tabs-header">
          <button class="tab-btn active" id="tab-btn-inspector">Node Properties</button>
          <button class="tab-btn" id="tab-btn-results">Execution Results</button>
        </div>
        <div class="panel-content-area">
          <div id="panel-inspector"></div>
          <div id="panel-execution-log" style="display: none;"></div>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
